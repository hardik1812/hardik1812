<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Ethereal gradient with soft falloff on edges -->
    <linearGradient id="antigravityLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft diffused ambient glow filter -->
    <filter id="softGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Line -->
  <line x1="80" y1="12" x2="1120" y2="12" stroke="url(#antigravityLine)" stroke-width="1.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Precision Center Node (Glass Orb) -->
  <circle cx="600" cy="12" r="5" fill="#0B0F19" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="600" cy="12" r="2.5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="600" cy="12" r="1.2" fill="#ffffff"/>

  <!-- Satellite Micro Dots -->
  <circle cx="560" cy="12" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="640" cy="12" r="1.5" fill="#818cf8" opacity="0.6"/>
</svg>
