<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%" fill="none">
  <defs>
    <!-- Fonts and styles -->
    <style>
      .num-tag { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
      .pill-text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; font-size: 11px; font-weight: 600; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.5; fill: #94a3b8; }
    </style>

    <!-- Card 1 Gradients & Glow -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="border1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Card 2 Gradients & Glow -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11162b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0e1e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="border2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Card 3 Gradients & Glow -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14122b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0b1e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="border3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= CARD 1: PRODUCT & MOBILE ================= -->
  <g transform="translate(20, 25)">
    <!-- Ambient Light Aura -->
    <circle cx="60" cy="50" r="70" fill="#38bdf8" opacity="0.08" filter="url(#cyanGlow)"/>

    <!-- Glass Surface -->
    <rect x="0" y="0" width="370" height="320" rx="18" fill="url(#cardGrad1)" stroke="url(#border1)" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Top Badge Row -->
    <rect x="24" y="24" width="86" height="26" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="36" y="41" fill="#38bdf8" class="num-tag">01 // UI</text>

    <!-- Minimal Device Icon -->
    <g transform="translate(305, 24)" stroke="#38bdf8" stroke-width="1.6" fill="none">
      <rect x="0" y="0" width="24" height="38" rx="4" stroke-opacity="0.6"/>
      <line x1="8" y1="4" x2="16" y2="4" stroke-linecap="round" stroke-opacity="0.8"/>
      <circle cx="12" cy="32" r="1.5" fill="#38bdf8"/>
    </g>

    <!-- Title -->
    <text x="24" y="94" fill="#f8fafc" class="card-title">MOBILE ARCHITECTURE</text>
    <text x="24" y="116" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12px" font-weight="500">Fluid client states &amp; offline persistence</text>

    <!-- Chips Container -->
    <g transform="translate(24, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="66" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="33" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Flutter</text>
      <!-- Pill 2 -->
      <rect x="74" y="0" width="50" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="99" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Dart</text>
      <!-- Pill 3 -->
      <rect x="132" y="0" width="94" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="179" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Drift / SQLite</text>
      <!-- Pill 4 -->
      <rect x="234" y="0" width="54" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="261" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">BLoC</text>
    </g>

    <!-- Description -->
    <text x="24" y="200" class="card-desc">
      <tspan x="24" dy="0">Reactive, offline-first applications with</tspan>
      <tspan x="24" dy="20">deterministic state machines, 120Hz gesture</tspan>
      <tspan x="24" dy="20">canvases, and smooth local-first sync engines.</tspan>
    </text>

    <!-- Bottom Accent Track -->
    <line x1="24" y1="288" x2="346" y2="288" stroke="#1e293b" stroke-width="1"/>
    <line x1="24" y1="288" x2="120" y2="288" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ================= CARD 2: BACKEND & CLOUD ================= -->
  <g transform="translate(415, 25)">
    <!-- Ambient Light Aura -->
    <circle cx="60" cy="50" r="70" fill="#818cf8" opacity="0.08" filter="url(#cyanGlow)"/>

    <!-- Glass Surface -->
    <rect x="0" y="0" width="370" height="320" rx="18" fill="url(#cardGrad2)" stroke="url(#border2)" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Top Badge Row -->
    <rect x="24" y="24" width="102" height="26" rx="6" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="35" y="41" fill="#818cf8" class="num-tag">02 // CLOUD</text>

    <!-- Cloud / Hex Icon -->
    <g transform="translate(305, 24)" stroke="#818cf8" stroke-width="1.6" fill="none">
      <path d="M6 14 A6 6 0 0 1 18 10 A7 7 0 0 1 30 14 A5 5 0 0 1 30 26 L6 26 A5 5 0 0 1 6 14 Z" stroke-opacity="0.6"/>
      <circle cx="18" cy="20" r="2" fill="#818cf8"/>
    </g>

    <!-- Title -->
    <text x="24" y="94" fill="#f8fafc" class="card-title">BACKEND &amp; DISTRIBUTED</text>
    <text x="24" y="116" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12px" font-weight="500">Asynchronous pipelines &amp; microservices</text>

    <!-- Chips Container -->
    <g transform="translate(24, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="68" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="34" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">FastAPI</text>
      <!-- Pill 2 -->
      <rect x="76" y="0" width="68" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="110" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Node.js</text>
      <!-- Pill 3 -->
      <rect x="152" y="0" width="88" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="196" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">PostgreSQL</text>
      <!-- Pill 4 -->
      <rect x="248" y="0" width="56" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="276" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Redis</text>
    </g>

    <!-- Description -->
    <text x="24" y="200" class="card-desc">
      <tspan x="24" dy="0">High-throughput async backends, distributed</tspan>
      <tspan x="24" dy="20">in-memory caching, secure transactional escrow</tspan>
      <tspan x="24" dy="20">flows, and resilient pub/sub event channels.</tspan>
    </text>

    <!-- Bottom Accent Track -->
    <line x1="24" y1="288" x2="346" y2="288" stroke="#1e293b" stroke-width="1"/>
    <line x1="24" y1="288" x2="120" y2="288" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ================= CARD 3: AI & LOW-LEVEL ================= -->
  <g transform="translate(810, 25)">
    <!-- Ambient Light Aura -->
    <circle cx="60" cy="50" r="70" fill="#c084fc" opacity="0.08" filter="url(#cyanGlow)"/>

    <!-- Glass Surface -->
    <rect x="0" y="0" width="370" height="320" rx="18" fill="url(#cardGrad3)" stroke="url(#border3)" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Top Badge Row -->
    <rect x="24" y="24" width="96" height="26" rx="6" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="35" y="41" fill="#c084fc" class="num-tag">03 // CORE</text>

    <!-- Microchip / Kernel Icon -->
    <g transform="translate(305, 24)" stroke="#c084fc" stroke-width="1.6" fill="none">
      <rect x="4" y="4" width="22" height="22" rx="3" stroke-opacity="0.6"/>
      <circle cx="15" cy="15" r="3" fill="#c084fc"/>
      <line x1="15" y1="0" x2="15" y2="4"/>
      <line x1="15" y1="26" x2="15" y2="30"/>
      <line x1="0" y1="15" x2="4" y2="15"/>
      <line x1="26" y1="15" x2="30" y2="15"/>
    </g>

    <!-- Title -->
    <text x="24" y="94" fill="#f8fafc" class="card-title">SYSTEMS &amp; NEURAL DSP</text>
    <text x="24" y="116" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12px" font-weight="500">Low-level runtime &amp; speech synthesis</text>

    <!-- Chips Container -->
    <g transform="translate(24, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="52" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="26" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">Rust</text>
      <!-- Pill 2 -->
      <rect x="60" y="0" width="52" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="86" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">eBPF</text>
      <!-- Pill 3 -->
      <rect x="120" y="0" width="86" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="163" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">StyleTTS 2</text>
      <!-- Pill 4 -->
      <rect x="214" y="0" width="58" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="243" y="16" fill="#cbd5e1" class="pill-text" text-anchor="middle">PyTorch</text>
    </g>

    <!-- Description -->
    <text x="24" y="200" class="card-desc">
      <tspan x="24" dy="0">High-performance Rust CLI/TUI utilities, kernel</tspan>
      <tspan x="24" dy="20">instrumentation via eBPF, and state-of-the-art</tspan>
      <tspan x="24" dy="20">neural speech synthesis DSP research.</tspan>
    </text>

    <!-- Bottom Accent Track -->
    <line x1="24" y1="288" x2="346" y2="288" stroke="#1e293b" stroke-width="1"/>
    <line x1="24" y1="288" x2="120" y2="288" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
